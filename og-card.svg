<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle teal accent stripe at top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- left column: shield + wordmark + tagline -->
  <g transform="translate(80, 175)">
    <!-- shield: scaled up version of favicon -->
    <g transform="scale(7.5)">
      <path fill="#14b8a6" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      <path fill="#0f0f0f" d="M12 3.19l7 3.11v5.7c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V6.3l7-3.11z"/>
      <path fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" d="M12 7v10m-5-5h10"/>
    </g>
  </g>

  <g transform="translate(310, 245)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f5f5f5">
    <text x="0" y="0" font-size="78" font-weight="700" letter-spacing="-1">Experience Digest</text>
    <text x="0" y="60" font-size="32" font-weight="400" fill="#aaa">Security intelligence for Adobe Commerce</text>
  </g>

  <!-- bottom-left URL bar -->
  <g transform="translate(80, 555)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="600" fill="#14b8a6" letter-spacing="0.5">experiencedigest.org</text>
  </g>

  <!-- bottom-right tag -->
  <g transform="translate(1120, 555)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="end">
    <text x="0" y="0" font-size="18" font-weight="500" fill="#666" letter-spacing="2">CVE · BULLETINS · ANALYSIS</text>
  </g>
</svg>
